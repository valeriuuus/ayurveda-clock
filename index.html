<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аюрведические Часы</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a2e" />
  <!-- Подключаем легкую библиотеку SunCalc для расчета восхода/заката -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Аюрведические Часы</h1>
      <p id="location-name">Определение локации...</p>
    </header>

    <div class="location-controls">
      <button id="btn-auto-location" class="btn">📍 Автовыбор (GPS)</button>
      <div class="select-group">
        <select id="select-country"><option value="">Выбрать страну...</option></select>
        <select id="select-city" disabled><option value="">Выбрать город...</option></select>
      </div>
    </div>

    <!-- Векторный SVG Циферблат -->
    <div class="clock-wrapper">
      <svg id="dosha-clock" viewBox="0 0 400 400">
        <!-- Секторы дош создаются динамически в JS -->
        <g id="sectors-group"></g>

        <!-- Разделительное кольцо (День / Ночь) -->
        <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
        <circle cx="200" cy="200" r="85" fill="#12121e" />

        <!-- Иконка Солнца и Луны -->
        <text x="200" y="45" class="symbol-icon" text-anchor="middle">☀️</text>
        <text x="200" y="365" class="symbol-icon" text-anchor="middle">🌙</text>

        <!-- Стрелка времени -->
        <g id="hand-group">
          <line x1="200" y1="200" x2="200" y2="35" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
          <circle cx="200" cy="200" r="8" fill="#FFFFFF" />
        </g>
      </svg>
    </div>

    <!-- Информационный блок текущей доши -->
    <div class="info-card">
      <div id="current-dosha-badge" class="badge">--</div>
      <h2 id="current-dosha-title">Определение...</h2>
      <p id="current-dosha-desc">Пожалуйста, разрешите доступ к геопозиции или выберите город.</p>
      <div class="sun-times">
        <span>🌅 Восход: <strong id="time-sunrise">--:--</strong></span>
        <span>🌇 Закат: <strong id="time-sunset">--:--</strong></span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
