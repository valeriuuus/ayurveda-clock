<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аюрведические Часы</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12121e" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Аюрведические Часы</h1>
      <p id="location-name">Определение локации...</p>
    </header>

    <div class="location-controls">
      <button id="btn-auto-location" class="btn">📍 Автовыбор (GPS)</button>
      <div class="select-group">
        <select id="select-country"><option value="">Выбрать страну...</option></select>
        <select id="select-city" disabled><option value="">Выбрать город...</option></select>
      </div>
    </div>

    <!-- Интерактивный SVG Циферблат -->
    <div class="clock-wrapper">
      <svg id="dosha-clock" viewBox="0 0 400 400">
        <!-- Секторы Дош -->
        <g id="sectors-group"></g>

        <!-- Текстовые метки Дош на английском (Vata, Kapha, Pitta) -->
        <g id="dosha-labels-group"></g>

        <!-- Разделительные линии и кольца -->
        <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
        <circle cx="200" cy="200" r="105" fill="#12121e" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

        <!-- Метки времени: 12:00, 18:00, 24:00, 6:00 -->
        <text x="200" y="32" class="time-label" text-anchor="middle">12:00</text>
        <text x="375" y="205" class="time-label" text-anchor="start">18:00</text>
        <text x="200" y="388" class="time-label" text-anchor="middle">24:00</text>
        <text x="25" y="205" class="time-label" text-anchor="end">6:00</text>

        <!-- Иконки Солнца и Луны -->
        <text x="200" y="125" class="symbol-icon" text-anchor="middle">☀️</text>
        <text x="200" y="285" class="symbol-icon" text-anchor="middle">🌙</text>

        <!-- Стрелка текущего времени -->
        <g id="hand-group">
          <line x1="200" y1="200" x2="200" y2="45" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
          <polygon points="194,55 200,38 206,55" fill="#FFFFFF" />
          <circle cx="200" cy="200" r="7" fill="#FFFFFF" />
        </g>
      </svg>
    </div>

    <!-- Карточка активного периода -->
    <div class="info-card">
      <div id="current-dosha-badge" class="badge">--</div>
      <h2 id="current-dosha-title">Определение...</h2>
      <p id="current-dosha-desc">Загрузка координат...</p>
      <div class="sun-times">
        <span>🌅 Восход: <strong id="time-sunrise">--:--</strong></span>
        <span>🌇 Закат: <strong id="time-sunset">--:--</strong></span>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
