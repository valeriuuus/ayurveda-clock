<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аюрведические Часы</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#12121e" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Аюрведические Часы</h1>
      <p id="location-name">Определение локации...</p>
    </header>

    <!-- Панель управления: Дата и Геолокация (в колонку) -->
    <div class="location-controls">
      <!-- Выбор даты -->
      <div class="field-group">
        <label for="input-date">📅 Выберите дату:</label>
        <input type="date" id="input-date" class="control-input" />
      </div>

      <!-- Автовыбор GPS -->
      <button id="btn-auto-location" class="btn control-input">📍 Автовыбор (GPS)</button>

      <!-- Поиск и выбор Страны -->
      <div class="field-group">
        <input type="text" id="input-country" class="control-input" list="datalist-countries" placeholder="🔍 Введите или выберите страну..." />
        <datalist id="datalist-countries"></datalist>
      </div>

      <!-- Поиск и выбор Города -->
      <div class="field-group">
        <input type="text" id="input-city" class="control-input" list="datalist-cities" placeholder="🔍 Введите или выберите город..." disabled />
        <datalist id="datalist-cities"></datalist>
      </div>
    </div>

    <!-- Интерактивный SVG Циферблат -->
    <div class="clock-wrapper">
      <svg id="dosha-clock" viewBox="0 0 400 400">
        <g id="sectors-group"></g>
        <g id="dosha-labels-group"></g>

        <circle cx="200" cy="200" r="185" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
        <circle cx="200" cy="200" r="105" fill="#12121e" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

        <text id="label-top" x="200" y="30" class="time-label" text-anchor="middle">Восход</text>
        <text id="label-right" x="375" y="205" class="time-label" text-anchor="start">Полдень</text>
        <text id="label-bottom" x="200" y="388" class="time-label" text-anchor="middle">Закат</text>
        <text id="label-left" x="25" y="205" class="time-label" text-anchor="end">Полночь</text>

        <text x="200" y="125" class="symbol-icon" text-anchor="middle">☀️</text>
        <text x="200" y="285" class="symbol-icon" text-anchor="middle">🌙</text>

        <g id="hand-group">
          <line x1="200" y1="200" x2="200" y2="45" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
          <polygon points="194,55 200,38 206,55" fill="#FFFFFF" />
          <circle cx="200" cy="200" r="7" fill="#FFFFFF" />
        </g>
      </svg>
    </div>

    <!-- Карточка активного периода -->
    <div class="info-card">
      <div id="current-dosha-badge" class="badge">--</div>
      <h2 id="current-dosha-title">Определение...</h2>
      <p id="current-dosha-desc">Загрузка координат...</p>
    </div>

    <!-- Таблица 1: Солнечные события -->
    <div class="table-card">
      <h3>Астрономические данные</h3>
      <table class="data-table">
        <tbody>
          <tr><td>🌅 Восход:</td><td id="time-sunrise" class="val">--:--</td></tr>
          <tr><td>☀️ Солнечный полдень:</td><td id="time-noon" class="val">--:--</td></tr>
          <tr><td>🌇 Закат:</td><td id="time-sunset" class="val">--:--</td></tr>
          <tr><td>⏳ Долгота дня:</td><td id="time-daylength" class="val">-- ч -- мин</td></tr>
          <tr><td>🧘‍♂️ Брахма-мухурта:</td><td id="time-brahma" class="val">--:-- - --:--</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Таблица 2: График периодов дош -->
    <div class="table-card">
      <h3>Расписание Дош на выбранный день</h3>
      <table class="data-table dosha-schedule-table">
        <thead>
          <tr>
            <th>Фаза</th>
            <th>Доша</th>
            <th>Время</th>
            <th>Длит.</th>
          </tr>
        </thead>
        <tbody id="dosha-schedule-body"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
